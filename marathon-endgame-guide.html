// React wrapper around the vanilla lucide UMD icon data
const camelAttrs = (attrs) => Object.fromEntries(
  Object.entries(attrs || {}).map(([k, v]) => [k.replace(/-([a-z])/g, (_, c) => c.toUpperCase()), v])
);
const renderNode = ([tag, attrs, children], key) =>
  React.createElement(tag, { key, ...camelAttrs(attrs) }, (children || []).map(renderNode));
const makeIcon = (name) => {
  // lucide UMD icon format: ["svg", attrs, [[tag, attrs, children?], ...]]
  const data = lucide.icons[name] || ['svg', {}, []];
  const children = data[2] || [];
  const Icon = ({ size = 16, strokeWidth = 2, className, style }) =>
    React.createElement('svg', {
      width: size, height: size, viewBox: '0 0 24 24', fill: 'none',
      stroke: 'currentColor', strokeWidth, strokeLinecap: 'round', strokeLinejoin: 'round',
      className, style,
    }, children.map(renderNode));
  return Icon;
};

function PlannerTab() {
  const [shellId, setShellId] = useState('sentinel');
  const [toggles, setToggles] = useState({ siphon: false, hauler: false, overclock: true, triage: false, skyeye: true, demo: false });
  const [sliders, setSliders] = useState({ heat: 70, shield: 60, loot: 20 });
  const [presetName, setPresetName] = useState('Rail Warden Build');

  const shell = SHELLS.find(s => s.id === shellId);

  const totals = useMemo(() => {
    let heat = sliders.heat, shieldv = sliders.shield, loot = sliders.loot;
    PLANNER_TOGGLES.forEach(t => { if (toggles[t.key]) { heat += t.mod.heat; shieldv += t.mod.shield; loot += t.mod.loot; } });
    const clamp = v => Math.max(0, Math.min(120, v));
    heat = clamp(heat); shieldv = clamp(shieldv); loot = clamp(loot);
    const power = Math.round(heat * 1.4 + shieldv * 1.6 + loot * 1.1 + Object.values(toggles).filter(Boolean).length * 18 + shell.stats.Utility * 0.8);
    const rating = power >= 380 ? 'S' : power >= 320 ? 'A' : power >= 250 ? 'B' : 'C';
    return { heat, shield: shieldv, loot, power, rating };
  }, [toggles, sliders, shell]);

  const applyPreset = (p) => {
    setShellId(SHELLS.find(s => s.name.toLowerCase() === p.shell.toLowerCase())?.id || 'sentinel');
    setToggles({ ...p.toggles });
    setSliders({ ...p.sliders });
    setPresetName(p.name);
  };

  const ratingColor = { S: '#ff2d78', A: '#00e5ff', B: '#3dff8b', C: '#ffe600' }[totals.rating];

  return (
    <div className="space-y-4">
      {/* Presets */}
      <Panel>
        <PanelHeader icon={Database} title="Preset Loadouts" color="#9d4dff" right={<span className="text-[9px] font-mono text-slate-500">CLICK TO LOAD</span>} />
        <div className="p-3 grid sm:grid-cols-2 lg:grid-cols-4 gap-2">
          {PRESET_BUILDS.map(p => (
            <button key={p.id} onClick={() => applyPreset(p)}
              className={`text-left rounded border p-3 transition ${presetName === p.name ? 'border-neon-violet/60 bg-neon-violet/10' : 'border-edge bg-black/40 hover:border-slate-600'}`}>
              <div className="text-xs font-bold text-slate-200">{p.name}</div>
              <div className="text-[9px] font-mono uppercase tracking-widest text-neon-violet mt-0.5">{p.shell} Shell</div>
              <p className="text-[10px] text-slate-500 mt-1">{p.desc}</p>
            </button>
          ))}
        </div>
      </Panel>

      <div className="grid lg:grid-cols-[1fr_320px] gap-4">
        <div className="space-y-4">
          {/* Shell select */}
          <Panel>
            <PanelHeader icon={Hexagon} title="Shell Chassis" color="#00e5ff" />
            <div className="p-3 grid grid-cols-3 gap-2">
              {SHELLS.map(s => (
                <button key={s.id} onClick={() => { setShellId(s.id); setPresetName('Custom Build'); }}
                  className={`rounded border p-3 flex flex-col items-center gap-1.5 transition ${shellId === s.id ? '' : 'border-edge bg-black/40 hover:border-slate-600'}`}
                  style={shellId === s.id ? { borderColor: s.color, background: s.color + '12' } : {}}>
                  <s.icon size={18} style={{ color: s.color }} />
                  <span className="font-mono text-[10px] tracking-widest" style={{ color: shellId === s.id ? s.color : '#94a3b8' }}>{s.name}</span>
                </button>
              ))}
            </div>
          </Panel>

          {/* Toggles */}
          <Panel>
            <PanelHeader icon={Cpu} title="Faction Module Toggles" color="#ff8a00" />
            <div className="p-3 grid sm:grid-cols-2 gap-2">
              {PLANNER_TOGGLES.map(t => {
                const on = toggles[t.key];
                return (
                  <button key={t.key} onClick={() => { setToggles(prev => ({ ...prev, [t.key]: !prev[t.key] })); setPresetName('Custom Build'); }}
                    className={`flex items-center gap-3 rounded border p-3 text-left transition ${on ? '' : 'border-edge bg-black/40 hover:border-slate-600'}`}
                    style={on ? { borderColor: t.color + '88', background: t.color + '10' } : {}}>
                    <t.icon size={16} style={{ color: on ? t.color : '#475569' }} className="shrink-0" />
                    <div className="min-w-0 flex-1">
                      <div className="text-xs font-semibold" style={{ color: on ? t.color : '#cbd5e1' }}>{t.name}</div>
                      <div className="text-[10px] text-slate-500">{t.effect}</div>
                    </div>
                    <div className={`w-9 h-5 rounded-full p-0.5 shrink-0 transition ${on ? '' : 'bg-edge'}`} style={on ? { background: t.color + '55' } : {}}>
                      <div className={`w-4 h-4 rounded-full transition-transform ${on ? 'translate-x-4' : ''}`} style={{ background: on ? t.color : '#475569', boxShadow: on ? `0 0 8px ${t.color}` : 'none' }} />

          {/* Sliders */}

                  <div className="flex items-center justify-between mb-1.5">
                    <span className="flex items-center gap-1.5 text-xs font-mono uppercase tracking-wider text-slate-300"><s.icon size={13} style={{ color: s.color }}/>{s.label}</span>
                    <span className="font-mono text-sm font-bold" style={{ color: s.color }}>{sliders[s.key]}</span>
                  </div>
                  <input type="range" min="0" max="100" value={sliders[s.key]}
                    onChange={e => { setSliders(prev => ({ ...prev, [s.key]: +e.target.value })); setPresetName('Custom Build'); }}
                    className="w-full" />
                </div>
              ))}
            </div>
          </Panel>
        </div>

        {/* Output panel */}
        <div className="space-y-4">
          <Panel accent={ratingColor}>
            <PanelHeader icon={Activity} title="Build Output" color={ratingColor} />
            <div className="p-4">
              <div className="text-center mb-4">
                <div className="text-[10px] font-mono uppercase tracking-widest text-slate-500">{presetName}</div>
                <div className="text-xs font-mono mt-0.5" style={{ color: shell.color }}>{shell.name} CHASSIS</div>
                <div className="mt-3 inline-grid place-items-center w-20 h-20 rounded-full border-2 relative"
                     style={{ borderColor: ratingColor, boxShadow: `0 0 24px ${ratingColor}55, inset 0 0 18px ${ratingColor}22` }}>
                  <span className="text-3xl font-black" style={{ color: ratingColor, textShadow: `0 0 14px ${ratingColor}` }}>{totals.rating}</span>
                </div>
                <div className="mt-2 font-mono text-xs text-slate-400">POWER INDEX <span className="text-slate-100 font-bold">{totals.power}</span></div>
              </div>
              <StatBar label="Eff. Heat Capacity" value={Math.min(100, totals.heat)} color="#ff2d78" />
              <StatBar label="Eff. Shield Regen" value={Math.min(100, totals.shield)} color="#00e5ff" />
              <StatBar label="Eff. Loot Speed" value={Math.min(100, totals.loot)} color="#ffe600" />
              <div className="mt-3 pt-3 border-t border-edge space-y-1.5">
                <div className="text-[9px] font-mono uppercase tracking-widest text-slate-500 mb-1">Active Modules</div>
                {PLANNER_TOGGLES.filter(t => toggles[t.key]).map(t => (
                  <div key={t.key} className="flex items-center gap-1.5 text-[11px]" style={{ color: t.color }}>
                    <CheckCircle2 size={11} /> {t.name}
                  </div>
                ))}
                {Object.values(toggles).every(v => !v) && <div className="text-[11px] text-slate-600 font-mono">// no modules slotted</div>}
              </div>
            </div>
          </Panel>
          <Panel className="p-3 text-[10px] font-mono text-slate-500 leading-relaxed">
            <Eye size={11} className="inline mr-1 text-neon-cyan" />
            Power Index weights Shield Regen highest (Archive sustain checks), then Heat. 380+ projects S-tier viability in patch 2.1.0.
          </Panel>
        </div>
      </div>
    </div>
  );
}

/* ============================ TAB: RAID ============================ */

function RaidMapSVG({ activeWing, setActiveWing }) {
  // 6 wings arranged around a central spine on the colony ship
  const nodes = [
    { id: 1, x: 110, y: 250 }, { id: 2, x: 230, y: 130 }, { id: 3, x: 350, y: 250 },
    { id: 4, x: 350, y: 90 },  { id: 5, x: 480, y: 170 }, { id: 6, x: 600, y: 170 },
  ];
  const links = [[1,2],[2,3],[2,4],[3,5],[4,5],[5,6]];
  const pos = id => nodes.find(n => n.id === id);
  return (
    <svg viewBox="0 0 700 340" className="w-full h-auto" role="img" aria-label="Cryo Archive wing map">
      <defs>
        <radialGradient id="hullGlow" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stopColor="#00e5ff" stopOpacity="0.07" />
          <stop offset="100%" stopColor="#000" stopOpacity="0" />
        </radialGradient>
      </defs>
      {/* hull silhouette */}
      <ellipse cx="350" cy="170" rx="330" ry="150" fill="url(#hullGlow)" stroke="#1c1c2b" strokeWidth="1.5" strokeDasharray="6 5" />
      <text x="350" y="322" textAnchor="middle" fontFamily="monospace" fontSize="10" fill="#475569" letterSpacing="4">UESC COLONY SHIP — ORBITAL DECK PLAN</text>
      {/* connections */}
      {links.map(([a,b],i) => {
        const A = pos(a), B = pos(b);
        const hot = activeWing === a || activeWing === b;
        return <line key={i} x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke={hot ? '#00e5ff' : '#1c1c2b'} strokeWidth={hot ? 2 : 1.5} strokeDasharray={hot ? '0' : '4 4'} />;
      })}
      {/* wing nodes */}
      {nodes.map(n => {
        const wing = RAID_WINGS.find(w => w.id === n.id);
        const active = activeWing === n.id;
        return (
          <g key={n.id} onClick={() => setActiveWing(n.id)} style={{ cursor: 'pointer' }}>
            {active && <circle cx={n.x} cy={n.y} r="34" fill={wing.color} opacity="0.12">
              <animate attributeName="r" values="30;38;30" dur="2s" repeatCount="indefinite" />
            </circle>}
            <polygon
              points={`${n.x},${n.y-22} ${n.x+19},${n.y-11} ${n.x+19},${n.y+11} ${n.x},${n.y+22} ${n.x-19},${n.y+11} ${n.x-19},${n.y-11}`}
              fill={active ? wing.color + '22' : '#0b0b12'}
              stroke={active ? wing.color : '#334155'} strokeWidth="2" />
            <text x={n.x} y={n.y+5} textAnchor="middle" fontFamily="monospace" fontWeight="bold" fontSize="14" fill={active ? wing.color : '#94a3b8'}>{n.id}</text>
            <text x={n.x} y={n.y+38} textAnchor="middle" fontFamily="monospace" fontSize="8.5" fill={active ? wing.color : '#64748b'} letterSpacing="1">
              {wing.name.split('— ')[1].toUpperCase()}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function RaidTab() {
  const [activeWing, setActiveWing] = useState(1);
  const [checked, setChecked] = useState({});
  const wing = RAID_WINGS.find(w => w.id === activeWing);
  const toggleStep = (i) => setChecked(prev => ({ ...prev, [`${activeWing}-${i}`]: !prev[`${activeWing}-${i}`] }));
  const done = wing.steps.filter((_, i) => checked[`${activeWing}-${i}`]).length;

  return (
    <div className="space-y-4">
      <Panel accent="#00e5ff" className="scanline">
        <div className="p-5">
          <div className="flex flex-wrap items-center gap-3 mb-1">
            <Snowflake size={20} className="text-neon-cyan" />
            <h2 className="text-xl font-black tracking-widest text-neon-cyan glow-cyan">THE CRYO ARCHIVE</h2>
            <span className="text-[9px] font-mono px-2 py-0.5 rounded border border-neon-pink/50 text-neon-pink">HARDCORE // 6-WING RAID</span>
          </div>
          <p className="text-xs text-slate-400 max-w-3xl">
            Multi-wing endgame raid zone aboard the orbiting UESC colony ship. Progression gates on Security Clearance
            levels (L1 → L3) and Holotags slotted at manifest terminals. Click any wing on the deck plan below.
          </p>
        </div>
        <div className="px-2 pb-2"><RaidMapSVG activeWing={activeWing} setActiveWing={setActiveWing} /></div>
      </Panel>

      <div className="grid lg:grid-cols-[1fr_300px] gap-4">
        {/* Step checklist */}
        <Panel accent={wing.color}>
          <PanelHeader icon={KeyRound} title={wing.name} color={wing.color}
            right={<span className="font-mono text-[10px]" style={{ color: wing.color }}>{done}/{wing.steps.length} STEPS</span>} />
          <div className="p-4">
            <div className="flex flex-wrap gap-2 mb-4">
              <span className="text-[10px] font-mono px-2 py-1 rounded border flex items-center gap-1.5" style={{ color: wing.color, borderColor: wing.color + '55', background: wing.color + '10' }}>
                <Lock size={10}/>{wing.clearance}
              </span>
              <span className="text-[10px] font-mono px-2 py-1 rounded border border-neon-yellow/50 text-neon-yellow bg-neon-yellow/5 flex items-center gap-1.5">
                <Wifi size={10}/>{wing.holotags}
              </span>
              <span className="text-[10px] font-mono px-2 py-1 rounded border border-neon-pink/50 text-neon-pink bg-neon-pink/5 flex items-center gap-1.5">
                <Skull size={10}/>BOSS: {wing.boss}
              </span>
            </div>
            <ol className="space-y-2">
              {wing.steps.map((step, i) => {
                const isDone = !!checked[`${activeWing}-${i}`];
                return (
                  <li key={i}>
                    <button onClick={() => toggleStep(i)} className={`w-full text-left flex gap-3 rounded border p-3 transition ${isDone ? 'border-neon-green/40 bg-neon-green/5' : 'border-edge bg-black/40 hover:border-slate-600'}`}>
                      {isDone ? <CheckCircle2 size={16} className="text-neon-green shrink-0 mt-0.5" /> : <Circle size={16} className="text-slate-600 shrink-0 mt-0.5" />}
                      <div>
                        <span className="font-mono text-[9px] uppercase tracking-widest" style={{ color: wing.color }}>Step {i + 1}</span>
                        <p className={`text-xs mt-0.5 ${isDone ? 'text-slate-500 line-through' : 'text-slate-300'}`}>{step}</p>
                      </div>
                    </button>
                  </li>
                );
              })}
            </ol>
          </div>
        </Panel>

        {/* Clearance routing summary */}
        <div className="space-y-4">
          <Panel>
            <PanelHeader icon={KeyRound} title="Clearance Routing" color="#ffe600" />
            <div className="p-3 space-y-2">
              {[
                { lvl: 'L1', src: 'UESC officers (Outpost / Dire Marsh drops)', gates: 'Wings 1–2' },
                { lvl: 'L2', src: 'Forged in Wing 3 (L1 card + Wing-2 datachip)', gates: 'Wings 3–4' },
                { lvl: 'L3', src: 'Wing-3 boss drop only — no forgery', gates: 'Wings 5–6' },
              ].map(c => (
                <div key={c.lvl} className="bg-black/40 border border-edge rounded p-2.5">
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-xs font-bold text-neon-yellow">{c.lvl} CLEARANCE</span>
                    <span className="text-[9px] font-mono text-slate-500">{c.gates}</span>
                  </div>
                  <p className="text-[10px] text-slate-400 mt-1">{c.src}</p>
                </div>
              ))}
            </div>
          </Panel>
          <Panel>
            <PanelHeader icon={Wifi} title="Holotag Manifest" color="#00e5ff" />
            <div className="p-3 space-y-1.5">
              {RAID_WINGS.map(w => (
                <button key={w.id} onClick={() => setActiveWing(w.id)}
                  className={`w-full flex items-center gap-2 text-left rounded px-2.5 py-2 border text-[11px] transition ${activeWing === w.id ? 'bg-white/5' : 'border-transparent hover:bg-white/5'}`}
                  style={activeWing === w.id ? { borderColor: w.color + '66' } : {}}>
                  <span className="font-mono font-bold w-5" style={{ color: w.color }}>W{w.id}</span>
                  <span className="text-slate-400 truncate flex-1">{w.holotags}</span>
                </button>
              ))}
            </div>
          </Panel>
          <Panel className="p-3 text-[10px] font-mono text-slate-500 leading-relaxed">
            <AlertTriangle size={11} className="inline mr-1 text-neon-yellow" />
            Wing-checkpoint caches bank loot permanently — a Wing 6 wipe never costs banked drops.
          </Panel>
        </div>
      </div>
    </div>
  );
}

/* ============================ APP ============================ */

  const [activeTab, setActiveTab] = useState('home');
  return (
    <div className="min-h-screen bg-void">
      <NavBar activeTab={activeTab} setActiveTab={setActiveTab} />
      <main className="max-w-7xl mx-auto px-4 py-5">
        {activeTab === 'home' && <HomeTab setActiveTab={setActiveTab} />}
        {activeTab === 'shells' && <ShellsTab />}
        {activeTab === 'planner' && <PlannerTab />}
        {activeTab === 'factions' && <FactionsTab />}
        {activeTab === 'raid' && <RaidTab />}
      </main>
      <footer className="border-t border-edge py-5 text-center">
        <p className="text-[10px] font-mono text-slate-600 tracking-widest">
          RUNNER.DB // UNOFFICIAL FAN DATABASE — MARATHON © BUNGIE · DATA: SEASON 2 PATCH 2.1.0 · NO AFFILIATION
        </p>

}
