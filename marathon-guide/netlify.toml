# Netlify deployment configuration.
# Set VITE_SITE_URL (and optionally VITE_ANALYTICS_ENDPOINT / VITE_ERROR_ENDPOINT)
# in the Netlify environment settings.
[build]
  command = "npm run ingest:news && npm run build"
  publish = "dist"

# Prerendered routes are served as static HTML; anything else (e.g. /search?q=, /admin,
# unknown slugs → 404 page) falls back to the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
