# Fully automated news ingestion: pulls the official Bungie.net feed every 6 hours,
# commits any changes to news.json, which triggers the host's deploy-on-push.
name: Ingest official news

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ingest-news.mjs
        working-directory: marathon-guide
      - name: Commit updated feed
        run: |
          git config user.name "news-ingest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add marathon-guide/src/data/db/news.json
          git diff --cached --quiet || git commit -m "chore: ingest official news feed"
          git push
